# SimpleSSD device configuration for PipeANN's SimSSDFileReader.
# Models a mainstream NVMe SSD: PCIe Gen3 x4, 8-channel MLC NAND, 16KiB
# pages, page-level FTL, 512MiB DRAM, ~512GiB raw capacity (~384GiB logical).
# Read cache / read prefetch are disabled because DiskANN-style graph search
# issues random 4KiB reads where prefetching would distort timing.
# Pass this file via PIPEANN_SIMSSD_DEVICE_CONFIG to override the built-in
# default.  See third_party/SimpleSSD-Standalone/simplessd/config/sample.cfg
# for the full list of tunables.

[cpu]
ClockSpeed = 400000000
HILCoreCount = 1
ICLCoreCount = 1
FTLCoreCount = 1

[nvme]
PCIEGeneration = 2
PCIELane = 4
AXIBusWidth = 2
AXIClock = 250000000
FIFOTransferUnit = 2048
WorkInterval = 1000000
MaxRequestCount = 8
MaxIOCQueue = 16
MaxIOSQueue = 16
WRRHigh = 2
WRRMedium = 2
DefaultNamespace = 1
LBASize = 512
EnableDiskImage = 0
StrictSizeCheck = 0
DiskImageFile1 = nvme.img
UseCopyOnWriteDisk = 0

[pal]
Channel = 8
Package = 4
Die = 2
Plane = 2
Block = 512
Page = 512
PageSize = 16384
EnableMultiPlaneOperation = 1
NANDType = 1
LSBRead = 40000000
LSBWrite = 500000000
CSBRead = 0
CSBWrite = 0
MSBRead = 65000000
MSBWrite = 1300000000
Erase = 3500000000
DMASpeed = 400
DMAWidth = 8
SuperblockSize = C
PageAllocation = CWDP

[ftl]
MappingMode = 0
OverProvisioningRatio = 0.25
EraseThreshold = 100000
FillingMode = 0
FillRatio = 0.0
# SimSSDFileReader automatically raises this to the opened index file size.
MinFillBytes = 0
InvalidPageRatio = 0.0
EvictPolicy = 0
DChoiceParam = 3
GCThreshold = 0.05
GCMode = 0
GCReclaimBlocks = 1
GCReclaimThreshold = 0.1
EnableRandomIOTweak = 1

[icl]
CacheSize = 536870912
CacheWaySize = 8
EnableReadCache = 0
EnableReadPrefetch = 0
ReadPrefetchMode = 1
ReadPrefetchCount = 3
ReadPrefetchRatio = 0.25
EnableWriteCache = 1
EvictPolicy = 2
EvictMode = 1
CacheLatency = 10

[dram]
Model = 0
Channel = 1
Rank = 1
Bank = 8
Chip = 1
BusWidth = 32
BurstLength = 8
ChipSize = 1073741824
PageSize = 4096
